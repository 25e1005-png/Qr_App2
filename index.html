
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR名刺管理アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <header>
    <h1>QR名刺管理アプリ</h1>
    <p>連絡先を簡単に管理・共有</p>
  </header>

  <main>
    <section class="dashboard">
      <div class="stat"><span>登録人数</span><strong id="totalCount">0</strong></div>
      <div class="stat"><span>友達</span><strong id="friendCount">0</strong></div>
      <div class="stat"><span>先生</span><strong id="teacherCount">0</strong></div>
      <div class="stat"><span>その他</span><strong id="otherCount">0</strong></div>
    </section>

    <section class="panel">
      <h2>連絡先を追加</h2>
      <form id="contactForm">
        <input id="name" placeholder="名前" required>
        <input id="phone" placeholder="電話番号">
        <input id="email" type="email" placeholder="メールアドレス">
        <input id="url" type="url" placeholder="Webサイト URL">
        <select id="group">
          <option value="friend">友達</option>
          <option value="teacher">先生</option>
          <option value="other">その他</option>
        </select>
        <button type="submit">登録する</button>
      </form>
    </section>

    <section class="panel">
      <h2>QRコード読み込み</h2>
      <div class="actions">
        <button id="startScan">カメラで読み込む</button>
        <button id="stopScan">カメラ停止</button>
      </div>
      <div id="reader"></div>
      <p id="status">QRコードを読み込んでください。</p>
    </section>

    <section class="panel">
      <h2>連絡先一覧</h2>
      <input id="search" placeholder="名前・電話番号で検索">
      <select id="filterGroup">
        <option value="all">すべて表示</option>
        <option value="friend">友達</option>
        <option value="teacher">先生</option>
        <option value="other">その他</option>
      </select>
      <div id="contactList"></div>
    </section>

    <section class="panel">
      <h2>データ転送</h2>
      <p>連絡先を複数のQRコードに分けて共有できます。</p>
      <button id="exportData">転送用QRコードを作成</button>
      <div id="generatedQR"></div>
      <button id="importData">転送QRを読み込む</button>
    </section>

    <section class="panel">
      <h2>操作履歴</h2>
      <p id="undoMessage">削除した連絡先は45秒以内なら復元できます。</p>
      <button id="undoButton" disabled>元に戻す</button>
    </section>
  </main>

  <footer>QR名刺管理アプリ</footer>
  <script src="script.js"></script>
</body>
</html>
